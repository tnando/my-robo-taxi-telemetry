name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write  # For SARIF uploads (gosec, trivy)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the diff so the expensive jobs can skip PROSE-ONLY changes
  # (Actions-minutes trim, client-directed 2026-08-13). Two outputs:
  #
  #   code — false only when EVERY changed file is prose: *.md anywhere,
  #          LICENSE, .gitignore. Deliberately NOT a docs/** glob:
  #          docs/contracts/schemas/*.json feeds the contract-conformance
  #          suite, so a schema edit must run the full pipeline. When
  #          `code` is false, test/contract/security skip, and build/deploy
  #          skip with them through `needs` — a docs-only merge to main
  #          deploys nothing, which is correct: the server does not ship
  #          its own docs.
  #   deps — true when go.mod/go.sum/Dockerfile moved. Gates the Trivy
  #          image scan on PRs: the image's vulnerability surface moves
  #          with the base image and the dependency graph, not with
  #          application code. Main pushes always scan.
  #
  # FAIL-SAFE: any classification error reports code=true, deps=true —
  # the failure mode is "ran jobs it could have skipped", never a skipped
  # gate. Skipped jobs satisfy branch protection (GitHub treats job-level
  # `if` skips as passing for required checks); a workflow-level
  # paths-ignore would instead leave required checks pending forever,
  # which is why the gate is a job.
  changes:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.classify.outputs.code }}
      deps: ${{ steps.classify.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin "${{ github.base_ref }}"
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            before="${{ github.event.before }}"
            case "$before" in
              ""|0000000000000000000000000000000000000000) files="" ;;
              *) files=$(git diff --name-only "$before" "${{ github.sha }}") ;;
            esac
          fi
          if [ -z "$files" ]; then
            echo "diff unavailable — failing safe to code=true"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "deps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          code=false; deps=false
          while IFS= read -r f; do
            case "$f" in
              *.md|LICENSE|.gitignore) ;;
              go.mod|go.sum|Dockerfile*) code=true; deps=true ;;
              *) code=true ;;
            esac
          done <<EOF
          $files
          EOF
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          args: --timeout=5m
          # Only report new issues on PRs; report all on push to main
          only-new-issues: ${{ github.event_name == 'pull_request' }}
          # Don't duplicate module cache with setup-go
          skip-cache: true

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: telemetry_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Run unit tests with race detector
        run: |
          # Use ./... to catch all packages; skip if no test files exist yet
          # Exclude /cmd/ (no tests) and /proto/ (generated protobuf code has no tests)
          PKGS=$(go list ./... 2>/dev/null | grep -v '/cmd/' | grep -v '/proto/' || true)
          if [ -z "$PKGS" ]; then
            echo "No testable packages found, skipping"
            exit 0
          fi
          echo "$PKGS" | xargs go test -race -coverprofile=coverage.out -covermode=atomic -count=1

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/telemetry_test?sslmode=disable
          INTEGRATION: "true"
        run: |
          # Only run if integration test packages exist
          PKGS=$(go list -tags=integration ./tests/integration/... 2>/dev/null || true)
          if [ -z "$PKGS" ]; then
            echo "No integration test packages found, skipping"
            exit 0
          fi
          echo "$PKGS" | xargs go test -race -tags=integration -count=1 -timeout=120s

      - name: Enforce coverage threshold (80%)
        run: |
          if [ ! -f coverage.out ]; then
            echo "No coverage report yet, skipping threshold check"
            exit 0
          fi
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80.0" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the 80% threshold"
            exit 1
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 7

  contract:
    name: Contract conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # MYR-141: contract-level conformance tests for the Go REST surface.
    # These mount the real handlers from `internal/telemetry/*` against a
    # real Postgres (via testcontainers-go) and assert wire-shape adherence
    # for every endpoint in `docs/contracts/schemas/`. The tests are
    # tagged `contract` so the default `go test ./...` (which runs without
    # Docker on dev laptops) does not pull them in.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Run contract conformance tests
        # GitHub-hosted runners have Docker available; the suite's
        # TestMain skips out cleanly if it ever isn't. -count=1 disables
        # the test cache so the suite runs against the canonical
        # schemas on every push.
        run: go test -tags=contract -count=1 -timeout=180s ./tests/contract/...

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Report vulnerabilities but don't fail CI for stdlib-only issues.
          # Our code will inherit fixes when the Go toolchain is upgraded.
          govulncheck ./... || echo "::warning::govulncheck found vulnerabilities (see above)"

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif -exclude-generated ./...'

      - name: Upload gosec SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec-results.sarif
        continue-on-error: true  # Graceful failure on fork PRs (read-only token)

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint, test, contract, security]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Build all binaries
        run: go build -ldflags="-s -w" ./cmd/...

      - name: Check for Dockerfile
        id: dockerfile
        run: test -f Dockerfile && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (no push)
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: telemetry:${{ github.sha }}

      - name: Scan Docker image with Trivy
        # Scoped to dependency/Dockerfile changes on PRs (the image's vuln
        # surface moves with the base image + module graph, not app code);
        # every main push still scans, so nothing reaches prod unscanned.
        if: steps.dockerfile.outputs.exists == 'true' && (needs.changes.outputs.deps == 'true' || github.ref == 'refs/heads/main')
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: telemetry:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.dockerfile.outputs.exists == 'true' && (needs.changes.outputs.deps == 'true' || github.ref == 'refs/heads/main')
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    needs: [build, security]
    # Only deploy on push to main (not PRs).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.4.27

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
