openapi: 3.1.0
info:
  title: MyRoboTaxi Telemetry REST API
  version: 1.0.0
  summary: REST surface for the MyRoboTaxi SDK v1.
  description: |
    Non-streaming REST surface that binds the Go telemetry server's REST
    handlers (PLANNED, see divergences DV-19/DV-20) to the MyRoboTaxi
    TypeScript and Swift SDKs. This document is the machine-readable twin
    of `docs/contracts/rest-api.md`. The markdown is the human source of
    truth; this YAML is consumed by OpenAPI tooling, `contract-tester`
    fixtures, and SDK code generators.

    The snapshot response references `schemas/vehicle-state.schema.json`
    via `$ref` rather than re-declaring the VehicleState shape. REST-only
    shapes (DriveSummary, DriveDetail, DriveRoute, RoutePoint, Invite,
    CreateInviteRequest, ErrorEnvelope, PaginatedDrives, PaginatedInvites,
    DeleteUserResponse) are declared inline under components/schemas for
    the v1 scope. A follow-up will extract them to sibling JSON Schemas.

    Anchored requirements: FR-3.2, FR-3.3, FR-3.4, FR-5.1, FR-5.2, FR-5.3,
    FR-5.4, FR-5.5, FR-6.1, FR-6.2, FR-7.1, FR-7.3, FR-9.1, FR-9.2, FR-10.1,
    FR-10.2, NFR-3.5, NFR-3.11, NFR-3.19, NFR-3.20, NFR-3.21, NFR-3.22,
    NFR-3.23, NFR-3.27, NFR-3.29.

    Known, accepted divergences between this spec and the current
    `internal/server/` + `internal/store/` implementation are catalogued
    in rest-api.md §10 with stable DV-NN identifiers (DV-19 through DV-23
    in this PR). Any divergence not listed there is contract drift.
  contact:
    name: sdk-architect
    url: https://github.com/myrobotaxi/telemetry/tree/main/docs/contracts
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://api.myrobotaxi.com/api
    description: |
      Production telemetry server. HTTPS required (NFR-3.22). TLS
      termination at the Fly.io edge. Browser clients originate from
      https://app.myrobotaxi.com. Same host as the WebSocket channel
      (/api/ws) -- the /api prefix is shared with the existing
      Tesla-owned endpoints /api/vehicle-status/{vin} and
      /api/fleet-config/{vin}.
  - url: http://localhost:8080/api
    description: |
      Local development server. Plain HTTP allowed only when the server
      is bound to loopback. The SDK MUST refuse non-loopback HTTP hosts
      in production builds.

security:
  - bearerAuth: []

tags:
  - name: snapshot
    description: Cold-load vehicle state snapshot (NFR-3.5, NFR-3.11).
  - name: drives
    description: Drive history list, per-drive detail, per-drive route playback (FR-3.2, FR-3.3, FR-3.4, FR-9.1, FR-9.2).
  - name: invites
    description: Sharing invite lifecycle (FR-5.1, FR-5.2, FR-5.3).
  - name: account
    description: User-initiated data deletion (FR-10.1, FR-10.2).

paths:
  /vehicles:
    get:
      operationId: listVehicles
      tags: [snapshot]
      summary: List the signed-in caller's vehicles (catalog only).
      description: |
        Returns a thin catalog of vehicles the authenticated caller is
        allowed to see. Catalog only — no GPS, no navigation, no live
        telemetry detail. Per-vehicle live state lives in
        GET /api/vehicles/{vehicleId}/snapshot (§7.1).

        Pre-MYR-91 the only way to enumerate vehicles was the WebSocket
        auth_ok frame's vehicleCount, which carried a count but not the
        IDs needed to call other endpoints. This endpoint closes that
        gap and is the SDK's vehicle-enumeration entry point.

        RBAC: owner sees all VehicleSummary fields; viewer sees all
        except `name` (P1, owner-curated nickname). v1 implementation
        note: only the owner pathway is reachable today — viewer-merged
        access requires the Go server to read the Prisma-owned Invite
        table, which lands as a follow-up. Until then, viewer-tier
        callers receive an empty list.

        Pagination: not required in v1 (response is bounded; most users
        have ≤ 3 cars). Reserved cursor + limit query params for future
        use.
      x-anchored-requirements:
        - FR-4.x
        - FR-5.4
        - NFR-3.21
      responses:
        '200':
          description: Vehicles catalog for the authenticated caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclesListResponse'
              examples:
                owner-with-one-vehicle:
                  summary: Owner sees the full VehicleSummary for their car.
                  value:
                    items:
                      - vehicleId: clxyz1234567890abcdef
                        name: Stumpy
                        model: Model 3
                        year: 2024
                        color: Midnight Silver Metallic
                        vinLast4: '0001'
                        status: parked
                        chargeLevel: 78
                        estimatedRange: 245
                        lastUpdated: '2026-05-10T17:45:00Z'
                        role: owner
                empty-list:
                  summary: Authenticated user with no linked vehicles.
                  value:
                    items: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-role-masks:
        owner: ['*']
        # MYR-184 removed the `name` subtraction (the rider UI renders
        # "{Owner}'s {Vehicle}", and `name` is `required` in
        # vehicle-summary.schema.json, so stripping it made every viewer row
        # invalid). This line still said '!name'; corrected in MYR-435 while
        # auditing every viewer mask statement in the contracts.
        # The viewer row is the owner row PLUS sharePermission, minus nothing.
        # MYR-435 did not narrow this resource -- the thin catalog never
        # carried media, cabin or controls state (rest-api.md section 5.2.0).
        viewer: ['*', '+sharePermission']

  /vehicles/{vehicleId}/snapshot:
    get:
      operationId: getVehicleSnapshot
      tags: [snapshot]
      summary: Cold-load vehicle state snapshot.
      description: |
        Returns the full current VehicleState for a single vehicle. This
        is the snapshot the SDK fetches on cold page load and on every
        reconnect per NFR-3.11 (see websocket-protocol.md §7.2 reconnect
        sequence). The snapshot is the DB source-of-truth
        (data-lifecycle.md §1.2); the WebSocket is the real-time channel.

        Latency target: p95 < 500 ms end-to-end per requirements.md §3.1.

        RBAC: owners see all fields in vehicle-state.schema.json; viewers
        see all fields EXCEPT the full `vin`, which is owner-only per
        MYR-279 (see rest-api.md §5.2.1). `licensePlate` is deliberately
        visible to BOTH roles (MYR-286) -- a rider identifies the car at
        pickup from it. The limited_viewer extension slot (FR-5.5)
        is NOT implemented in v1 but is documented as the extension seam.
      x-anchored-requirements:
        - NFR-3.5
        - NFR-3.11
        - FR-1.1
        - FR-1.2
        - FR-2.1
      x-divergence: DV-20
      parameters:
        - $ref: '#/components/parameters/VehicleIdPath'
      responses:
        '200':
          description: Current VehicleState snapshot.
          content:
            application/json:
              schema:
                $ref: 'https://myrobotaxi.com/schemas/vehicle-state.schema.json'
              examples:
                parked-vehicle:
                  summary: Parked vehicle, no active navigation, disconnected from charger.
                  value:
                    vehicleId: clxyz1234567890abcdef
                    name: Stumpy
                    model: Model 3
                    year: 2024
                    color: Midnight Silver Metallic
                    status: parked
                    speed: 0
                    heading: 180
                    latitude: 10.0
                    longitude: 20.0
                    locationName: Home
                    locationAddress: 123 Market St, San Francisco, CA
                    gearPosition: P
                    chargeLevel: 78
                    chargeState: Disconnected
                    estimatedRange: 245
                    timeToFull: null
                    interiorTemp: 68
                    exteriorTemp: 55
                    odometerMiles: 12458
                    fsdMilesSinceReset: 412.7
                    destinationName: null
                    destinationAddress: null
                    destinationLatitude: null
                    destinationLongitude: null
                    originLatitude: null
                    originLongitude: null
                    etaMinutes: null
                    tripDistanceRemaining: null
                    navRouteCoordinates: null
                    licensePlate: ABC 1234
                    lastUpdated: '2026-04-13T18:22:01Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/VehicleNotOwned'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-role-masks:
        owner: ['*']
        viewer:
          description: >-
            An EXPLICIT ALLOW-LIST since MYR-435 (client decision 2026-08-02:
            "Remove media/cabin and any vehicle controls"). This mask was
            previously owner-minus-vin, a subtraction under which every field
            added to the owner list reached viewers by default -- the MYR-427
            audit finding. Viewers now receive location, navigation/route,
            identity, charge, availability and freshness, and receive NO media,
            NO cabin climate (including interiorTemp and exteriorTemp) and NO
            vehicle-controls state. licensePlate stays viewer-visible (MYR-286,
            deliberate -- a rider identifies the car at pickup); the full vin
            stays owner-only (MYR-279). Canonical enumeration with per-field
            reasoning is rest-api.md section 5.2.1.1. NOTE for consumers with
            generated bindings -- interiorTemp and exteriorTemp were moved out
            of the vehicle-state schema's `required` list in the same change;
            regenerate before this ships or a viewer snapshot fails to decode
            (rest-api.md section 5.2.1.2).
          allows:
            - vehicleId
            - name
            - model
            - year
            - color
            - softwareVersion
            - trim
            - trimLabel
            - fsdVersion
            - licensePlate
            - chargeLevel
            - chargeState
            - estimatedRange
            - timeToFull
            - status
            - gearPosition
            - speed
            - heading
            - latitude
            - longitude
            - locationName
            - locationAddress
            - serviceEstimatedEndAt
            - rideShareEnabled
            - setupState
            - odometerMiles
            - fsdMilesSinceReset
            - destinationName
            - destinationAddress
            - destinationLatitude
            - destinationLongitude
            - originLatitude
            - originLongitude
            - etaMinutes
            - tripDistanceRemaining
            - navRouteCoordinates
            - navDestinationName
            - navDestinationLocation
            - navOriginLocation
            - navEtaMinutes
            - navTripDistanceRemaining
            - driveTrailCoordinates
            - lastUpdated
        limited_viewer:
          description: FR-5.5 extension seam -- NOT implemented in v1. Documented for future readiness. It still excludes licensePlate even though the full `viewer` role now receives it (MYR-286) -- an invited viewer waiting at a pickup needs the plate, whereas the limited_viewer seam is the deliberately-degraded tier that also loses precise GPS and the whole navigation group.
          excludes:
            - licensePlate
            - navRouteCoordinates
            - destinationName
            - destinationAddress
            - destinationLatitude
            - destinationLongitude
            - originLatitude
            - originLongitude
          modifications:
            latitude: coarse_hash
            longitude: coarse_hash

  /vehicles/{vehicleId}/drives:
    get:
      operationId: listVehicleDrives
      tags: [drives]
      summary: Paginated drive history for a vehicle.
      description: |
        Returns a cursor-paginated list of completed drives for a
        vehicle, ordered by startTime DESC, id DESC. This is the
        one-shot paginated fetch half of FR-9.1 / FR-9.2; the reactive
        half is the WebSocket drive_ended subscription (see
        websocket-protocol.md §4.3). The SDK prepends newly-completed
        drives to its in-memory list on drive_ended WITHOUT re-fetching,
        satisfying FR-9.2.

        Ordering tiebreaker: id DESC is required for cursor stability
        when multiple drives share the same startTime millisecond.

        Retention: drives older than 365 days are pruned by the
        background retention job per NFR-3.27 (see data-lifecycle.md §5).
        A cursor scan that straddles a prune event MAY observe items
        disappearing from the tail -- this is acceptable.

        RBAC: OWNER ONLY, plus one exception. MYR-369 retired the
        `live_history` tier and with it every viewer's access to drive
        history: a `viewer` calling this receives 403
        vehicle_not_owned, at any grant shape. MYR-602 admits exactly
        one other role -- a `trip_participant`, and only to drives whose
        startTime falls inside a window they were a live participant of.
        That bound is on ROWS and is enforced by the handler and by the
        SQL statement, never by the field mask below (a mask hides a
        field; it cannot hide a row), which is why the participant's
        field set is the owner's. A participant asking for a drive
        outside their window is answered 404 not_found -- NOT 403,
        which would confirm the car made a journey on a day they were
        not part of -- and the same 404, byte for byte, covers a drive
        whose stored startTime cannot be read at all (the fault is
        logged, never told to the caller; MYR-614). See rest-api.md
        §5.2.4 and §7.4.

        startAddress/endAddress/energyUsedKwh/etc are intentionally NOT
        in the list response -- they are returned by the drive detail
        endpoint. See rest-api.md §5.2.2.
      x-anchored-requirements:
        - FR-3.2
        - FR-9.1
        - FR-9.2
        - NFR-3.27
      x-divergence: DV-20
      parameters:
        - $ref: '#/components/parameters/VehicleIdPath'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Paginated drive summary list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDrives'
              examples:
                two-drives:
                  summary: >-
                    First page with two drives — one inside a trip window the
                    caller is on, one outside every window, so the page shows
                    both spellings of the required-and-nullable `tripId`.
                  value:
                    items:
                      - id: clmno9876543210zyxw0001
                        vehicleId: clxyz1234567890abcdef
                        startTime: '2026-04-13T18:22:00Z'
                        endTime: '2026-04-13T18:46:18Z'
                        date: '2026-04-13'
                        distanceMiles: 12.4
                        durationSeconds: 1458
                        avgSpeedMph: 30.5
                        maxSpeedMph: 65.2
                        startChargeLevel: 82
                        endChargeLevel: 76
                        fsdMiles: 9.8
                        fsdPercentage: 79.0
                        # On a road trip: this drive's startTime falls inside a
                        # window the caller is on, so the server names it.
                        tripId: cltrp1234567890abcdef
                        createdAt: '2026-04-13T18:46:19Z'
                      - id: clmno9876543210zyxw0002
                        vehicleId: clxyz1234567890abcdef
                        startTime: '2026-04-13T08:14:00Z'
                        endTime: '2026-04-13T08:29:07Z'
                        date: '2026-04-13'
                        distanceMiles: 5.1
                        durationSeconds: 907
                        avgSpeedMph: 20.2
                        maxSpeedMph: 42.0
                        startChargeLevel: 85
                        endChargeLevel: 82
                        fsdMiles: 0.0
                        fsdPercentage: 0.0
                        # The SAME page carries both answers. This drive is in
                        # no window of the caller's, and `null` is the whole
                        # answer — the key is never omitted, because an absent
                        # key is indistinguishable from a server that does not
                        # send the field.
                        tripId: null
                        createdAt: '2026-04-13T08:29:08Z'
                    nextCursor: eyJzdGFydFRpbWUiOiIyMDI2LTA0LTEzVDA4OjE0OjAwWiIsImlkIjoiY2xtbm85ODc2NTQzMjEwenl4dzAwMDIifQ==
                    hasMore: true
                final-page:
                  summary: Final page (nextCursor null, hasMore false).
                  value:
                    items: []
                    nextCursor: null
                    hasMore: false
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/VehicleNotOwned'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-role-masks:
        owner: ['*']
        # MYR-369: the drives surfaces are owner-only again. No grant of
        # any shape opens them, so there is no viewer field set to
        # describe -- the call is refused before a mask is reached.
        viewer: denied
        # MYR-602: the same field set as the owner, deliberately. The
        # participant's bound is on ROWS (the trip window), applied by
        # the handler and by the statement that carries the LIMIT; a
        # mask can hide a field and cannot hide a row, so narrowing the
        # field set here would only misdescribe the gate.
        trip_participant: ['*']

  /drives/{driveId}:
    get:
      operationId: getDriveDetail
      tags: [drives]
      summary: Single drive detail with full FR-3.4 stats.
      description: |
        Returns the full FR-3.4 stats for a single completed drive. This
        is the endpoint invoked by the SDK's fetchDrive(driveId) helper
        paired with the drive_ended WebSocket message (see
        websocket-protocol.md §4.3 DV-11 resolution). The drive_ended
        wire payload is deliberately a summary; the full record lives
        here.

        Does NOT include routePoints -- those are returned by the
        separate GET /drives/{driveId}/route endpoint (heavy payload;
        lazy-fetch guidance on the route endpoint).

        RBAC: OWNER ONLY, plus one exception. MYR-369 retired the
        `live_history` tier and with it every viewer's access to drive
        history: a `viewer` calling this receives 403
        vehicle_not_owned, at any grant shape. MYR-602 admits exactly
        one other role -- a `trip_participant`, and only to drives whose
        startTime falls inside a window they were a live participant of.
        That bound is on ROWS and is enforced by the handler and by the
        SQL statement, never by the field mask below (a mask hides a
        field; it cannot hide a row), which is why the participant's
        field set is the owner's. A participant asking for a drive
        outside their window is answered 404 not_found -- NOT 403,
        which would confirm the car made a journey on a day they were
        not part of -- and the same 404, byte for byte, covers a drive
        whose stored startTime cannot be read at all (the fault is
        logged, never told to the caller; MYR-614). See rest-api.md
        §5.2.4 and §7.4.

        The `trip_participant` sees the owner's field set including the
        P1 start/end location and address (data-classification.md
        §1.4): what differs between the two roles is WHICH DRIVES they
        may ask for, never what a drive says once they may see it.
      x-anchored-requirements:
        - FR-3.4
        - FR-9.1
      x-divergence: DV-20
      parameters:
        - $ref: '#/components/parameters/DriveIdPath'
      responses:
        '200':
          description: Full drive detail record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveDetail'
              examples:
                happy-path:
                  summary: Completed morning commute.
                  value:
                    id: clmno9876543210zyxw0001
                    vehicleId: clxyz1234567890abcdef
                    startTime: '2026-04-13T18:22:00Z'
                    endTime: '2026-04-13T18:46:18Z'
                    date: '2026-04-13'
                    distanceMiles: 12.4
                    durationSeconds: 1458
                    avgSpeedMph: 30.5
                    maxSpeedMph: 65.2
                    energyUsedKwh: 4.2
                    startChargeLevel: 82
                    endChargeLevel: 76
                    fsdMiles: 8.1
                    fsdPercentage: 65.3
                    interventions: 1
                    startLocation: Location A
                    startAddress: synthetic-start-address
                    endLocation: Location B
                    endAddress: synthetic-end-address
                    createdAt: '2026-04-13T18:46:19Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/VehicleNotOwned'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-role-masks:
        owner: ['*']
        # MYR-369: the drives surfaces are owner-only again. No grant of
        # any shape opens them, so there is no viewer field set to
        # describe -- the call is refused before a mask is reached.
        viewer: denied
        # MYR-602: the same field set as the owner, deliberately. The
        # participant's bound is on ROWS (the trip window), applied by
        # the handler and by the statement that carries the LIMIT; a
        # mask can hide a field and cannot hide a row, so narrowing the
        # field set here would only misdescribe the gate.
        trip_participant: ['*']

  /drives/{driveId}/route:
    get:
      operationId: getDriveRoute
      tags: [drives]
      summary: Full GPS polyline for drive playback.
      description: |
        Returns the full GPS polyline for a drive as an array of
        RoutePoint records. The polyline is encrypted at rest via
        AES-256-GCM (NFR-3.23) on Drive.routePoints
        (data-classification.md §1.5), decrypted in the store layer per
        NFR-3.25, and transported plaintext over TLS (NFR-3.22). The
        SDK never sees ciphertext.

        Payload size: a 60-minute drive at 1 Hz is ~3,600 points and
        serializes to ~200-300 KB of JSON. This fits in any v1 target
        runtime (including watchOS). The SDK SHOULD fetch this endpoint
        lazily on user tap-through, not eagerly for every drive in the
        list -- NOT because of heap pressure (the payload is
        memory-safe) but to protect cellular bandwidth on low-bandwidth
        networks, especially watchOS per NFR-3.36. Eager prefetch on
        WiFi is acceptable for the top 1-3 drives.

        RBAC: OWNER ONLY, plus one exception. MYR-369 retired the
        `live_history` tier and with it every viewer's access to drive
        history: a `viewer` calling this receives 403
        vehicle_not_owned, at any grant shape. MYR-602 admits exactly
        one other role -- a `trip_participant`, and only to drives whose
        startTime falls inside a window they were a live participant of.
        That bound is on ROWS and is enforced by the handler and by the
        SQL statement, never by the field mask below (a mask hides a
        field; it cannot hide a row), which is why the participant's
        field set is the owner's. A participant asking for a drive
        outside their window is answered 404 not_found -- NOT 403,
        which would confirm the car made a journey on a day they were
        not part of -- and the same 404, byte for byte, covers a drive
        whose stored startTime cannot be read at all (the fault is
        logged, never told to the caller; MYR-614). See rest-api.md
        §5.2.4 and §7.4.

        The polyline is the most locating artifact this platform
        stores, and the admitted roles see it whole -- there is no
        partial polyline for a partial window; the window decides
        WHETHER the drive opens, not how much of it.
      x-anchored-requirements:
        - FR-3.3
        - NFR-3.23
      x-divergence: DV-20
      parameters:
        - $ref: '#/components/parameters/DriveIdPath'
      responses:
        '200':
          description: Drive route polyline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveRoute'
              examples:
                three-points:
                  summary: Short polyline excerpt (real drives are ~3,600 points).
                  value:
                    driveId: clmno9876543210zyxw0001
                    routePoints:
                      - lat: 10.0000
                        lng: 20.0000
                        speed: 0
                        heading: 180
                        timestamp: '2026-04-13T18:22:00Z'
                      - lat: 10.0002
                        lng: 20.0003
                        speed: 15
                        heading: 175
                        timestamp: '2026-04-13T18:22:03Z'
                      - lat: 10.0005
                        lng: 20.0007
                        speed: 22
                        heading: 170
                        timestamp: '2026-04-13T18:22:06Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/VehicleNotOwned'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-role-masks:
        owner: ['*']
        # MYR-369: the drives surfaces are owner-only again. No grant of
        # any shape opens them, so there is no viewer field set to
        # describe -- the call is refused before a mask is reached.
        viewer: denied
        # MYR-602: the same field set as the owner, deliberately. The
        # participant's bound is on ROWS (the trip window), applied by
        # the handler and by the statement that carries the LIMIT; a
        # mask can hide a field and cannot hide a row, so narrowing the
        # field set here would only misdescribe the gate.
        trip_participant: ['*']

  /vehicles/{vehicleId}/invites:
    get:
      operationId: listVehicleInvites
      tags: [invites]
      summary: List viewers and pending invites for a vehicle.
      description: |
        Returns the list of active viewers and pending invites for a
        vehicle. Not paginated in v1 -- typical viewer counts are small
        (1-10). Future pagination can be added as an additive change.

        RBAC: owner only. Viewers who call this receive 403
        permission_denied per FR-5.4 (the viewer list is an owner-only
        concern per FR-5.2).
      x-anchored-requirements:
        - FR-5.2
        - FR-5.4
      x-divergence: DV-23
      parameters:
        - $ref: '#/components/parameters/VehicleIdPath'
      responses:
        '200':
          description: Invite list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvites'
              examples:
                two-invites:
                  summary: One accepted viewer, one pending invite.
                  value:
                    items:
                      - id: clxyz1234567890invite01
                        vehicleId: clxyz1234567890abcdef
                        senderId: clxyz1234567890userid
                        label: Viewer A
                        email: invitee-a@example.com
                        status: accepted
                        permission: live_history
                        sentDate: '2026-04-01T10:00:00Z'
                        acceptedDate: '2026-04-01T11:23:00Z'
                        lastSeen: '2026-04-14T09:45:00Z'
                        isOnline: true
                        createdAt: '2026-04-01T10:00:00Z'
                        updatedAt: '2026-04-14T09:45:00Z'
                      - id: clxyz1234567890invite02
                        vehicleId: clxyz1234567890abcdef
                        senderId: clxyz1234567890userid
                        label: Viewer B
                        email: invitee-b@example.com
                        status: pending
                        permission: live_history
                        sentDate: '2026-04-14T10:00:00Z'
                        acceptedDate: null
                        lastSeen: null
