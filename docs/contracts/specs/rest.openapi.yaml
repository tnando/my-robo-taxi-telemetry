                PRECEDENCE order. `awaiting_owner_acknowledgment`
                (MYR-599, contracts v0.39.0) — this car was linked by
                somebody Tesla reports as a DRIVER of it rather than its
                owner, and the platform will not configure telemetry
                until that person acknowledges the owner approved adding
                it; THE LINKER MUST ACT (POST
                /api/tesla/vehicles/{vehicleId}/acknowledge-owner-approval,
                rest-api.md §7.29). It sorts FIRST because nothing has
                been pushed at such a car, so the push-shaped members
                below cannot truthfully apply, and because consent
                precedes pairing evidence. `owner_access_required`
                (MYR-599, contracts v0.40.0) — Tesla REFUSED to create
                the car's fleet-telemetry config, because the linking
                account holds DRIVER access and the Fleet API lets only
                the vehicle's OWNER account create one. COPY MUST NOT SAY
                "reconnect Tesla" (that is `token_failed`'s action and
                sends a person round a loop that cannot end): the car's
                Tesla owner must add it under their own account and share
                it with the driver. Emitted only on positive evidence —
                an acknowledged driver-access row plus the observed 404 —
                never from a bare 404, which a revoked grant also
                returns. `awaiting_virtual_key` —
                Tesla refused the telemetry config because the owner's
                virtual key is not enrolled; THE OWNER MUST ACT (pair the
                key in the Tesla app), and every signed command will be
                rejected until they do. `configuring` — the configuration
                is in hand and the server is waiting for the car to
                connect; NO OWNER ACTION IS REQUIRED. `token_failed` —
