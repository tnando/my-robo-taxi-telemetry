      x-role-masks:
        owner: ['*']
        viewer: denied
    post:
      operationId: createVehicleInvite
      tags: [invites]
      summary: Create a sharing invite for a vehicle.
      description: |
        Creates a sharing invite that grants the recipient (identified
        by email) read access to the vehicle as a viewer. The recipient
        accepts out-of-band via the Next.js app's invite-acceptance
        flow.

        Not idempotent in v1 (no Idempotency-Key). A retry after a
        network blip MAY create two invites for the same email; the
        owner can revoke either via DELETE /invites/{inviteId}. See
        rest-api.md §4.5.

        RBAC: owner only.
      x-anchored-requirements:
        - FR-5.1
        - FR-5.4
      x-divergence: DV-23
      parameters:
        - $ref: '#/components/parameters/VehicleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
            examples:
              history-invite:
                summary: Invite with history permission.
                value:
                  label: Viewer
                  email: invitee-a@example.com
                  permission: live_history
              live-only:
                summary: Invite with live permission only.
                value:
                  label: Viewer
                  email: invitee-c@example.com
                  permission: live
      responses:
        '201':
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
              examples:
                happy-path:
                  value:
                    id: clxyz1234567890invite01
                    vehicleId: clxyz1234567890abcdef
                    senderId: clxyz1234567890userid
                    label: Viewer
                    email: invitee-a@example.com
                    status: pending
                    permission: live_history
                    sentDate: '2026-04-14T10:00:00Z'
                    acceptedDate: null
                    lastSeen: null
                    isOnline: false
                    createdAt: '2026-04-14T10:00:00Z'
                    updatedAt: '2026-04-14T10:00:00Z'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-role-masks:
        owner: ['*']
        viewer: denied

  /invites/{inviteId}:
    delete:
      operationId: revokeInvite
      tags: [invites]
      summary: Revoke a sharing invite.
      description: |
        Revokes a sharing invite. If the invite was in pending state,
        it is deleted and the recipient cannot accept it. If the
        invite was in accepted state, the corresponding viewer
        immediately loses read access to the vehicle.

        The revocation also ends the viewer's LIVE WebSocket, not
        just their next handshake (MYR-373, websocket-protocol.md
        §4.5.1): the server closes that grantee's sessions for that
        vehicle with close code 4002 "vehicle access revoked", within
        milliseconds on the instance that served this request. The
        teardown is scoped to the revoked viewer -- the owner's own
        stream and other viewers' streams are unaffected. This closed
        the access-loss half of DV-09.

        Idempotent in the "equivalent final state" sense: a second
        DELETE returns 404 not_found.

        RBAC: owner of the invite's target vehicle only.
      x-anchored-requirements:
        - FR-5.3
        - FR-5.4
      x-divergence: DV-23
      parameters:
        - $ref: '#/components/parameters/InviteIdPath'
      responses:
        '204':
          description: Invite revoked. Empty body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-role-masks:
        owner: ['*']
        viewer: denied

  /users/me:
    delete:
      operationId: deleteCurrentUser
      tags: [account]
      summary: Delete the authenticated user's account and all associated data.
      description: |
        Deletes the authenticated user and everything the platform
        holds about them, per the sequence in data-lifecycle.md §3.
        Takes NO request body. Answers 204 No Content.

        REWRITTEN BY MYR-355 (2026-07-30). This operation previously
        declared a 200 + DeleteUserResponse body, a Next.js handler,
        and a NextAuth recent-auth gate. All three are superseded —
        see rest-api.md §7.6 "What changed and why".

        Handler location: the GO TELEMETRY SERVER serves this
        endpoint (cmd/telemetry-server/wiring_account_deletion.go).
        The native iOS client is the only consumer and never reaches
        the Next.js app, and most of what must be deleted lives in
        Go-owned tables (go_ride_requests, go_vehicle_shares,
        go_push_devices, go_refresh_tokens, go_users,
        go_identity_apple, go_removed_vehicles) that carry no FK to
        User and that no Prisma cascade reaches. This SUPERSEDES the
        remaining half of DV-23; DV-23 is now superseded in full.

        NOT one transaction. The per-vehicle teardown it composes is
        already a transaction with FOR UPDATE locks and a NOTIFY, and
        the ride-cancellation step sends push notifications, which
        cannot be rolled back. The contract guarantees RE-RUNNABILITY
        instead: every step is idempotent, and the identity rows the
        caller authenticates with are deleted LAST, so a 500 leaves a
        partially-deleted account that the SAME call finishes.

        CLIENTS MUST NOT sign the user out on a 500 — the token is
        what authenticates the retry. A second call after success is
        204, not an error, until the access token stops validating.

        Exactly one account_deleted AuditLog row is written per
        account however many times this is called (FR-10.2 /
        NFR-3.29): the final transaction probes the identity sources
        first and the already-gone arm writes nothing.

        Ride history is NOT deleted. Terminal rides where the caller
        was the rider are the OWNER's counterparty record and are
        kept whole; requesterName is then OMITTED from the wire
        (requester_exists false), which clients render as
        "Former rider". See data-lifecycle.md §3.3.1.

        No cross-user deletion: this endpoint operates on /users/me
        only. There is no 403 path.

        NOT IMPLEMENTED in this round: the MYR-76 recent-auth gate
        (auth_time <= REAUTH_MAX_AGE_SEC, subCode reauth_required).
        It was specified against the NextAuth auth_time claim, and
        the Go identity module's ES256 access token carries no such
        claim, so there is nothing to check. This is a deliberate,
        recorded gap — the GDPR Art. 17 rationale still stands. The
        control that ships is a two-step explicit confirmation in the
        iOS client.
      x-anchored-requirements:
        - FR-10.1
        - FR-10.2
        - NFR-3.29
      responses:
        '204':
          description: |
            Account deleted (or already deleted — the re-run arm).
            Empty body: there is no account left to describe.
            Clients MUST NOT attempt to decode the response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: |
            A step of the sequence failed. PARTIAL DELETION IS
            POSSIBLE AND EXPECTED — retry the same call to resume.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-role-masks:
        owner: self-only
        viewer: self-only

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer-style session token resolved by the consumer's
        getToken() callback (FR-6.1). The token is the SAME value the
        SDK passes in the WebSocket auth frame (websocket-protocol.md
        §2.2) -- the SDK maintains a single credential surface across
        WS and REST.

        Unlike the WebSocket path (which puts the token in the first
        WebSocket frame because browsers cannot set arbitrary headers
        on an upgrade), REST uses the standard Authorization header
        because REST has no upgrade handshake.

        On 401 the SDK MUST call getToken() to refresh and retry the
        request exactly once per FR-6.2. A second 401 is terminal and
        the error surfaces to the consumer as a typed auth_failed
        error.

        The token is P1 per data-classification.md §1.2. The server
        MUST NOT log the Authorization header in any structured log
        field, error message, metric label, or crash report.

  parameters:
    VehicleIdPath:
      name: vehicleId
      in: path
      required: true
      description: Opaque DB cuid for the vehicle (FR-4.2). Never a VIN.
      schema:
        type: string
        pattern: '^c[a-z0-9]+$'
        minLength: 20
        maxLength: 40
      example: clxyz1234567890abcdef
    DriveIdPath:
      name: driveId
      in: path
      required: true
      description: Opaque DB cuid for a completed drive. Matches the driveId carried by drive_started and drive_ended WebSocket frames.
      schema:
        type: string
        pattern: '^c[a-z0-9]+$'
        minLength: 20
        maxLength: 40
      example: clmno9876543210zyxw0001
    InviteIdPath:
      name: inviteId
      in: path
      required: true
      description: Opaque DB cuid for a sharing invite.
      schema:
        type: string
        pattern: '^c[a-z0-9]+$'
        minLength: 20
        maxLength: 40
      example: clxyz1234567890invite01
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return. Default 20, min 1, max 100. Requests with limit outside [1, 100] return 400 invalid_request.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque base64 pagination cursor returned by a prior response's nextCursor. The SDK MUST treat the cursor as opaque; the server reserves the right to change the encoding without a contract version bump.
      schema:
        type: string
      example: eyJzdGFydFRpbWUiOiIyMDI2LTA0LTEzVDA4OjE0OjAwWiIsImlkIjoiY2xtbm85ODc2NTQzMjEwenl4dzAwMDIifQ==

  responses:
    Unauthorized:
      description: |
        Missing, malformed, or invalid bearer token. On receipt the SDK
        MUST call getToken() and retry once per FR-6.2. A second 401 is
        terminal and surfaces as a typed auth_failed error.

        Special case: 401 auth_failed with subCode=reauth_required is
        emitted by /users/me/export (GET) when
        the bearer token is valid but the caller's auth_time claim is
        outside the recent-auth window (rest-api.md §7.6 / §7.7,
        MYR-76). This subCode is carved out from the getToken() retry
        path — the SDK MUST surface it to the consumer's auth layer
        for an interactive sign-in flow rather than swallowing it with
        a silent refresh, because the auth_time claim only advances on
        a fresh OAuth round-trip.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            auth-failed:
              value:
                error:
                  code: auth_failed
                  message: invalid token
                  subCode: null
            auth-timeout:
              value:
                error:
                  code: auth_timeout
                  message: 'authenticator.ValidateToken: deadline exceeded'
                  subCode: null
            reauth-required:
              summary: Recent-login re-auth gate failed (rest-api.md §7.6 / §7.7, MYR-76)
              value:
                error:
                  code: auth_failed
                  message: recent re-authentication required
                  subCode: reauth_required
    VehicleNotOwned:
      description: Caller is not the owner or an accepted viewer of the requested vehicleId (or drive's parent vehicleId).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            vehicle-not-owned:
              value:
                error:
                  code: vehicle_not_owned
                  message: caller does not own this vehicle
    PermissionDenied:
      description: Caller is authenticated but lacks the role required for this operation (e.g., viewer calling an invite endpoint).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            permission-denied:
              value:
                error:
                  code: permission_denied
                  message: owner role required for this operation
    NotFound:
      description: |
        The requested resource does not exist, or it exists but is not
        visible to the caller. REST-only error code -- the WebSocket
        path enforces ownership via silent filtering in Hub.Broadcast
        (websocket-protocol.md §4.5) and has no request-response
        equivalent. Added to the shared ErrorPayload.code enum as a
        REST-only extension -- see rest-api.md §4.1.1.a and DV-20.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unknown-vehicle:
              value:
                error:
                  code: not_found
                  message: vehicle does not exist
            unknown-drive:
              value:
                error:
                  code: not_found
                  message: drive does not exist
    InvalidRequest:
      description: |
        Request body, path params, or query string failed server-side
        validation. REST-only error code -- the WS protocol has no v1
        client->server frames with structured payloads beyond auth, so
        malformed-body errors cannot arise there. Added to the shared
        ErrorPayload.code enum as a REST-only extension -- see
        rest-api.md §4.1.1.a and DV-20.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            bad-cursor:
              value:
                error:
                  code: invalid_request
                  message: malformed cursor
            limit-out-of-range:
              value:
                error:
                  code: invalid_request
                  message: limit must be between 1 and 100
            bad-email:
              value:
                error:
                  code: invalid_request
                  message: invalid email address
    RateLimited:
      description: |
        Per-user REST rate limit breached (PLANNED: 120 requests/minute,
        see DV-22). SDK MUST apply exponential backoff per
        websocket-protocol.md §7.1 reconnect curve.
      headers:
        Retry-After:
          description: Advisory delay in seconds before the SDK should retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            rest-rate-limited:
              value:
                error:
                  code: rate_limited
                  message: REST rate limit exceeded
    ServiceUnavailable:
      description: |
        Reserved for maintenance windows and graceful-shutdown states
        (DV-21). Not emitted in v1; documented here so SDK consumers
        can write forward-compatible handlers.
      headers:
        Retry-After:
          description: Advisory delay in seconds before the SDK should retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            maintenance:
              value:
                error:
                  code: service_unavailable
                  message: scheduled maintenance in progress
    InternalError:
      description: Unexpected server failure. SDK auto-retries with exponential backoff up to 3 attempts before surfacing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            catchall:
              value:
                error:
                  code: internal_error
                  message: internal server error

  schemas:
    ErrorEnvelope:
      type: object
      description: |
        Standard error envelope for all non-2xx REST responses. The
        `error.code` field is a stable typed enum that SDK consumers
        branch on per FR-7.1. The `error.message` field is a
        human-readable description for logs and developer tooling and
        MUST NOT contain any P1 value (no GPS, no addresses, no tokens,
        no emails, no raw VINs). See rest-api.md §4.1 and
        data-classification.md §2.2.

        The code enum is a superset of the WebSocket ErrorPayload.code
        enum in schemas/ws-messages.schema.json. REST-only codes
        (not_found, invalid_request, service_unavailable) are called
        out in the value descriptions. Consumers that share a CoreError
        type across transports reuse the same enum values as the WS
        side -- the enums intentionally overlap.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          description: Nested error object carrying the typed code, human-readable message, and optional sub-code. All inner fields are P0; this wrapper is P0 overall.
          x-classification: P0
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: |
                Stable typed error code. Reuses the WebSocket
                ErrorPayload.code catalog plus the REST-only extensions
                not_found, invalid_request, and service_unavailable.
                SDK consumers branch on this value, never on `message`.
              enum:
                - auth_failed
                - auth_timeout
                - permission_denied
                - vehicle_not_owned
                - not_found
                - invalid_request
                - rate_limited
                - internal_error
                - service_unavailable
              x-classification: P0
            message:
              type: string
              description: |
                Human-readable description for logs and developer
                tooling. P0 but MUST NOT contain P1 values -- no GPS,
                no addresses, no tokens, no emails, no VINs (unless
                redacted to ***XXXX via redactVIN()). Error
                construction sites use opaque IDs (vehicleId, driveId,
                userId, inviteId) for correlation.
              x-classification: P0
            subCode:
              type: string
              nullable: true
              description: |
                Optional typed sub-code. The field is always present on
                the wire; the carrier emits JSON `null` when there is
                no sub-code to attach. Two non-null values in v1:

                - device_cap (WS-only): per-user concurrent-connection
                  cap breach on the WebSocket path. Declared on the
                  REST envelope only for shared-type compatibility
                  with the SDK's CoreError union — REST v1 does not
                  emit this value.
                - reauth_required (REST-only): the recent-login
                  re-auth gate on GET /users/me/export rejected the
                  request because the
                  caller's auth_time claim is missing or older than
                  REAUTH_MAX_AGE_SEC (default 300 s). The SDK MUST
                  surface this subCode to the consumer's auth layer
                  for an interactive sign-in flow; see rest-api.md
                  §7.6 / §7.7 (MYR-76) and the §4.1.1 auth_failed
                  row.
              enum: [device_cap, reauth_required]
              x-classification: P0

    VehicleSummary:
      type: object
      description: |
        Thin catalog representation of a vehicle returned by
        GET /api/vehicles. Owner and viewer see the same field set;
        the viewer row additionally carries `sharePermission` (MYR-184).
        The viewer mask subtracts NOTHING — `name` included, since the
        rider UI renders "{Owner}'s {Vehicle}" and the field is
        `required` in schemas/vehicle-summary.schema.json. No GPS / nav
        / charge-detail / climate fields — those live in the
        per-vehicle snapshot (§7.1).
      required:
        - vehicleId
        - model
        - year
        - color
        - vinLast4
        - status
        - chargeLevel
        - estimatedRange
        - lastUpdated
        - role
      properties:
        vehicleId:
          type: string
          description: Opaque DB cuid for the vehicle (FR-4.2). Never a VIN.
          example: clxyz1234567890abcdef
          x-classification: P0
        name:
          type: string
          description: |
            User-assigned vehicle nickname. P1 because it's commonly a
            recognizable name; owner-only visibility (viewers see the
            field absent from their projection per §5.2.0).
          example: Stumpy
          x-classification: P1
        model:
          type: string
          description: |
            Tesla model — Model 3, Model S, Model X, Model Y, Cybertruck, etc.
            POPULATED FOR EVERY CAR SINCE MYR-507 (contracts v0.31.0): the
            field, type and masks are unchanged, only the provenance is new.
            Previously filled only for vehicles linked through the Prisma web
            flow — the Go server's provisioning INSERT seeded `''` and nothing
            ever filled it, so a Go-linked car reported an empty model forever.
            Now derived from VIN position 4 at link time and backfilled on the
            non-waking refresh. FILL-IF-EMPTY, never overwrite: the Prisma flow
            writes a richer value for some cars ("Model 3 Performance") than a
            VIN position can encode. Key ALWAYS present; `''` means "not
            determined" (unrecognised VIN code — this server never guesses).
          example: Model 3
          x-classification: P0
        year:
          type: integer
          description: |
            Model year. POPULATED FOR EVERY CAR SINCE MYR-507 (contracts
            v0.31.0) — same placeholder problem and same fix as `model` above.
            Derived from VIN position 10 (ISO 3779 model-year code); Tesla's
            Fleet API carries no model year at ANY path, so the VIN is the
            platform's only source. FILL-IF-EMPTY, never overwrite. Key ALWAYS
            present; `0` means "not determined" and is NEVER a real model year —
            treat it exactly as an empty `model` and drop the fragment.
          example: 2024
          x-classification: P0
        color:
          type: string
          description: Display color.
          example: Midnight Silver Metallic
          x-classification: P0
        trimLabel:
          type: string
          nullable: true
          description: |
            OPTIONAL (MYR-507, contracts v0.31.0). The DISPLAY-READY trim —
            "Plaid", "Performance", "Long Range". THE SAME VALUE AND THE SAME
            COLUMN as VehicleState.trimLabel (§7.1, MYR-320), read rather than
            re-derived, so the catalog and the snapshot cannot name one car two
            different things. Source: `trim_label` on go_vehicle_control_state
            (migration 0018), written from Tesla REST
            `vehicle_data.vehicle_config.performance_package`.
            On the catalog for a consumer the snapshot cannot serve: a VIEWER
            never fetches a /snapshot, so this row is the ONLY surface on which
            a shared car can say what it is. Without it a rider's descriptor
            degraded to the raw colour token ("UltraRed") or the bare make
            ("Tesla"). With `year`, `model` and `color` alongside it, a row now
            carries everything "2026 Model X Plaid · Ultra Red" needs.
            NOT the raw badge code: VehicleState.trim ("p74d") is not
            display-safe and is absent from the catalog under both roles.
            NULL IS NOT THE EMPTY STRING — it means "no trim known", and a
            descriptor MUST drop the fragment rather than emit a stray
            separator. An ABSENT key means a server predating v0.31.0 and reads
            exactly like null. RBAC: BOTH roles — an equipment fact of the tier
            of its identity siblings model/year/color, all legible through a
            windshield. Not streamed; refreshes on the next list fetch.
          example: Plaid
          x-classification: P0
        ownerFirstName:
          type: string
          nullable: true
          description: |
            OPTIONAL (MYR-581, contracts v0.37.0; confirmation-gated by
            MYR-583). The CONFIRMED display FIRST NAME of the person
            who OWNS this vehicle. TWO CONDITIONS, BOTH REQUIRED: the owner must
            have CONFIRMED a name through PATCH /api/users/me (§7.26), AND that
            name must resolve on the ladder below. A name nobody confirmed
            resolves `null`, exactly like no name at all — two of the three
            rungs are filled by machinery the person never saw (Apple's
            first-consent payload; whatever the legacy web onboarding wrote,
            including a `Tesla User` placeholder), so a resolvable name is not
            evidence of consent. Resolved by the platform's THREE-SOURCE
            identity ladder — Prisma `"User".name`, then the Apple
            first-consent name in `go_identity_apple`, then `go_users` — and
            reduced to its first whitespace-separated token. The SAME
            resolution and the SAME reduction behind
            `RideRequest.requesterName` and
            `RedeemShareInviteResponse.ownerFirstName`.
            FIRST NAMES ONLY is the P1 counterparty policy, and the LADDER
            rather than the one table is not pedantry: the Go server's user
            provisioning uses ON CONFLICT DO NOTHING, so a pre-existing row can
            carry a NULL name that the Apple identity still resolves — a
            one-table lookup calls a perfectly named owner nameless.
            On the catalog for the same consumer `trimLabel` is: a VIEWER never
            fetches a /snapshot, so this row is the only surface on which a
            rider meets the person whose car they were granted. With no name to
            render the client fell back to the make, which is how an incoming
            ride card came to read "Tesla wants a ride" about a human being
            (MYR-532 item 4).
            NULL IS NOT THE EMPTY STRING — it means this owner has no resolvable
            name in any identity source, the ordinary state for an Apple-native
            account Apple was never asked to name, and a possessive descriptor
            MUST drop the whole fragment rather than render "'s Model X". An
            ABSENT key means a server predating v0.37.0 and reads exactly like
            null. RBAC: BOTH roles — the owner's own row naming them is a
