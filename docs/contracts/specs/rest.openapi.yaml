                refreshed; THE OWNER MUST ACT (reconnect Tesla). New
                members may be added in a minor version: consumers MUST
                treat an unrecognised value as "setup is incomplete,
                reason unknown" and MUST NOT fail the decode.
              example: awaiting_virtual_key
            since:
              type: string
              format: date-time
              description: |
                RFC 3339 UTC instant at which the evidence behind `state`
                was recorded. Data for the copy ("for 2 days"), not an
                input for re-deriving `state`. Never zero and never in the
                future — the server floors it at the read instant.
              example: '2026-08-09T02:10:00Z'
          x-classification: P0

    VehiclesListResponse:
      type: object
      description: |
        Wrapper response for GET /api/vehicles. v1 returns the full list
        in `items` and omits pagination metadata (response is bounded).
        Future iterations may add `nextCursor` + `hasMore` per §4.2 once
        per-user vehicle counts exceed bounded list rendering — SDK
        consumers branch on the absence of `nextCursor` to detect a v1
        server.
      required:
        - items
      properties:
        items:
          type: array
          description: Vehicles the authenticated caller is allowed to see.
          items:
            $ref: '#/components/schemas/VehicleSummary'

    DriveSummary:
      type: object
      description: |
        Lightweight drive record returned by the paginated drive list
        endpoint. Includes the four P1 location/address fields so the
        SDK can render origin/destination labels in the history list
        without an extra DriveDetail fetch per row (MYR-145), plus the
        P0 fsdMiles/fsdPercentage stats so the history list can show
        FSD usage per drive without a DriveDetail fetch (MYR-152).
        Still deliberately omits energyUsedKwh/interventions/routePoints
        -- those are in DriveDetail and DriveRoute and are heavier per
        row. startLocation / startAddress / endLocation / endAddress are
        OPTIONAL on the wire: when the underlying Drive column is
        empty (drive in progress, zero-GPS at start, reverse-geocode
        failed) the server omits the JSON key entirely rather than
        emitting "" or null -- consumers branch on key presence.
      required:
        - id
        - vehicleId
        - startTime
        - endTime
        - date
        - distanceMiles
        - durationSeconds
        - avgSpeedMph
        - maxSpeedMph
        - startChargeLevel
        - endChargeLevel
        - fsdMiles
        - fsdPercentage
        - createdAt
        - tripId
      additionalProperties: false
      properties:
        id:
          type: string
          description: Opaque DB cuid for this drive.
          x-classification: P0
        vehicleId:
          type: string
          description: Opaque DB cuid for the drive's parent vehicle.
          x-classification: P0
        tripId:
          type: ["string", "null"]
          description: |
            The trip whose WINDOW contains this drive's start instant, as
            far as THIS caller is concerned, or null when the drive falls
            in no window they may see (MYR-608, contracts v0.44.0).

            ALWAYS PRESENT AND NULLABLE — it is in `required` and its type
            is ["string","null"], deliberately NOT the omit-when-empty
            convention the four location labels on this same shape follow.
            Those are absent because the server has nothing to say YET (a
            geocode may still arrive); this is a DECIDED answer. A missing
            key would be indistinguishable from a server that does not send
            the field, and a consumer grouping drives under trips would
            silently fall back to ungrouped against a deployed server that
            simply had nothing to sum.

            RESOLVED SERVER-SIDE, NEVER RE-DERIVED. A consumer MUST group by
            this value and MUST NOT reconstruct it from `startTime` and a
            trip's window: two implementations of one rule is what this
            field exists to delete.

            ROLE-SCOPED IN THE STATEMENT that produced the row. On §7.2 an
            owner is told about the windows THEY own (a car can change
            hands; a previous owner's trip is never named) and a trip
            participant only about the windows that admitted them. On
            §7.30.7 every row carries the trip in the request path.

            OVERLAPPING WINDOWS: two ENDED trips may cover one drive (the
            create probe only refuses windows that have not closed), and on
            §7.2 the NEWEST by `startsAt` wins. §7.30.7 always answers with
            the trip it was asked for. This is the one place two surfaces
            may report a different `tripId` for the same drive.

            AN UNREADABLE `startTime` RESOLVES null AND TAKES NOTHING DOWN.
            `Drive.startTime` is a TEXT column, and the server compares it
            as an instant through a guarded try-cast, so a value that will
            not parse yields null rather than failing the page — on this
            endpoint, on §7.30.7 and on the trip totals alike. A BARE DATE
            IS READABLE: `2026-07-02` is midnight on that day and is placed
            in whatever window covers it.
          x-classification: P0
        startTime:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when the drive began.
          x-classification: P0
        endTime:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when the drive ended.
          x-classification: P0
        date:
          type: string
          description: Local date string (e.g., "2026-04-13").
          x-classification: P0
        startLocation:
          type: string
          description: |
            Reverse-geocoded place name at the drive's start (e.g.,
            "Home", "Whole Foods Market"). P1 per data-classification.md
            §1.4. OMITTED from the JSON payload when the underlying
            Drive.startLocation column is empty (zero-GPS at drive
            start or reverse-geocode failed).
          x-classification: P1
        startAddress:
          type: string
          description: |
            Reverse-geocoded street address at the drive's start.
            P1 per data-classification.md §1.4. OMITTED from the JSON
            payload when the underlying Drive.startAddress column is
            empty.
          x-classification: P1
        endLocation:
          type: string
          description: |
            Reverse-geocoded place name at the drive's end. P1 per
            data-classification.md §1.4. OMITTED from the JSON payload
            when the underlying Drive.endLocation column is empty
            (drive in progress, zero-GPS at drive end, or
            reverse-geocode failed).
          x-classification: P1
        endAddress:
          type: string
          description: |
            Reverse-geocoded street address at the drive's end. P1 per
            data-classification.md §1.4. OMITTED from the JSON payload
            when the underlying Drive.endAddress column is empty.
          x-classification: P1
        distanceMiles:
          type: number
          minimum: 0
          description: Total distance driven in miles (FR-3.4).
          x-classification: P0
          x-unit: miles
        durationSeconds:
          type: integer
          minimum: 0
          description: Total drive duration in seconds (FR-3.4). Matches the WebSocket drive_ended.payload.durationSeconds shape (DV-12 resolution).
          x-classification: P0
          x-unit: seconds
        avgSpeedMph:
          type: number
          minimum: 0
          description: Average speed in miles per hour (FR-3.4).
          x-classification: P0
          x-unit: mph
        maxSpeedMph:
          type: number
          minimum: 0
          description: Max speed in miles per hour (FR-3.4).
          x-classification: P0
          x-unit: mph
        startChargeLevel:
          type: integer
          minimum: 0
          maximum: 100
          description: Battery percent at drive start (FR-3.4).
          x-classification: P0
          x-unit: percent
        endChargeLevel:
          type: integer
          minimum: 0
          maximum: 100
          description: Battery percent at drive end (FR-3.4).
          x-classification: P0
          x-unit: percent
        fsdMiles:
          type: number
          minimum: 0
          description: Miles driven under Full Self-Driving during this drive (FR-3.4).
          x-classification: P0
          x-unit: miles
        fsdPercentage:
          type: number
          minimum: 0
          maximum: 100
          description: Percent of the drive covered by FSD (FR-3.4).
          x-classification: P0
          x-unit: percent
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 UTC row-creation timestamp.
          x-classification: P0

    DriveDetail:
      type: object
      description: |
        Full FR-3.4 drive record returned by GET /drives/{driveId}.
        Contains every FR-3.4 field EXCEPT routePoints, which is
        returned by the separate GET /drives/{driveId}/route endpoint.
        startAddress/endAddress/startLocation/endLocation are P1 per
        data-classification.md §1.4 -- both owners and viewers see
        them (viewer has explicit consent via the accepted invite).
      required:
        - id
        - vehicleId
        - startTime
        - endTime
        - date
        - distanceMiles
        - durationSeconds
        - avgSpeedMph
        - maxSpeedMph
        - energyUsedKwh
        - startChargeLevel
        - endChargeLevel
        - fsdMiles
        - fsdPercentage
        - interventions
        - createdAt
      additionalProperties: false
      properties:
        id:
          type: string
          x-classification: P0
        vehicleId:
          type: string
          x-classification: P0
        startTime:
          type: string
          format: date-time
          x-classification: P0
        endTime:
          type: string
          format: date-time
          x-classification: P0
        date:
          type: string
          x-classification: P0
        distanceMiles:
          type: number
          minimum: 0
          x-classification: P0
          x-unit: miles
        durationSeconds:
          type: integer
          minimum: 0
          x-classification: P0
          x-unit: seconds
        avgSpeedMph:
          type: number
          minimum: 0
          x-classification: P0
          x-unit: mph
        maxSpeedMph:
          type: number
          minimum: 0
          x-classification: P0
          x-unit: mph
        energyUsedKwh:
          type: number
          description: >
            Energy consumed during the drive in kilowatt-hours (FR-3.4).
            MAY BE NEGATIVE (MYR-629, contracts v0.45.0): a net-regen leg — a
            long descent that ends with more charge than it began with — is a
            real measurement, and the drive tracker reports the physical figure
            rather than clamping it. The `minimum: 0` this field carried until
            v0.45.0 was removed for that reason; the widening is
            backward-compatible for readers (every value that validated before
            still validates) and a client MUST NOT assume non-negativity.
            0 means the drive could not be measured, which is why
            `Trip.totalEnergyKwh` refuses to sum a window containing a moved
            drive that reports it. The WINDOW total is floored at 0, so
            `Trip.totalEnergyKwh` keeps its `minimum: 0`.
          x-classification: P0
          x-unit: kWh
        startChargeLevel:
          type: integer
          minimum: 0
          maximum: 100
          x-classification: P0
          x-unit: percent
        endChargeLevel:
          type: integer
          minimum: 0
          maximum: 100
          x-classification: P0
          x-unit: percent
        fsdMiles:
